    let selectedSeason = 'Summer';
    let selectedConcern = 'Dry';
    let selectedTone = 'Warm';
    let selectedFinish = 'Glow';
    let selectedCategory = 'All';
    let cartItems = [];

    function switchPage(pageName) {
        ['search', 'mycart', 'info'].forEach(p => {
            document.getElementById(`page-${p}`).classList.toggle('hidden', p !== pageName);
            document.getElementById(`tab-${p}`).classList.toggle('active', p === pageName);
        });
        if (pageName === 'mycart') updateCartPage();
    }

    function setSeason(s) { selectedSeason = s; updateFilters(); }
    function setConcern(c) { selectedConcern = c; updateFilters(); }
    function setTone(t) { selectedTone = t; updateFilters(); }
    function setFinish(f) { selectedFinish = f; updateFilters(); }
    function setCategory(cat) { selectedCategory = cat; updateFilters(); }

    function updateFilters() {
        ['summer', 'winter'].forEach(id => document.getElementById(`btn-${id}`).classList.toggle('active', selectedSeason === id.charAt(0).toUpperCase() + id.slice(1)));
        ['dry', 'oily'].forEach(id => document.getElementById(`btn-${id}`).classList.toggle('active', selectedConcern === id.charAt(0).toUpperCase() + id.slice(1)));
        ['warm', 'cool'].forEach(id => document.getElementById(`tone-${id}`).classList.toggle('active', selectedTone === id.charAt(0).toUpperCase() + id.slice(1)));
        ['glow', 'matte'].forEach(id => document.getElementById(`finish-${id}`).classList.toggle('active', selectedFinish === id.charAt(0).toUpperCase() + id.slice(1)));
        ['all', 'base', 'lip', 'eye', 'cheek'].forEach(id => document.getElementById(`category-${id}`).classList.toggle('active', selectedCategory.toLowerCase() === id));
        updateCosmeList();
    }

    function updateCosmeList() {
        const cosmeList = document.getElementById('cosme-list');
        const filtered = cosmesticsData.filter(c => {
            const matchSeason = c.season === selectedSeason;
            const matchConcern = c.concern === selectedConcern;
            const matchTone = c.tone === selectedTone;
            const matchFinish = c.finish === selectedFinish;
            const matchCategory = selectedCategory === 'All' || c.category === selectedCategory;
            return matchSeason && matchConcern && matchTone && matchFinish && matchCategory;
        });

        cosmeList.innerHTML = filtered.length ? '' : '<div class="col-span-full text-center py-12 opacity-60">✦ この条件にぴったりの魔法を準備中だよ ✦<br><span class="text-xs">別の診断結果も試してみてね！</span></div>';
        filtered.forEach(c => {
            const isSelected = cartItems.some(item => item.id === c.id);
            const proxiedImage = `https://images.weserv.nl/?url=${encodeURIComponent(c.image)}&w=400&errorredirect=https://placehold.jp/24/5d4a4a/ffffff/200x200.png?text=${encodeURIComponent(c.brand)}`;
            
            const card = document.createElement('div');
            card.className = `cosme-card p-4 flex flex-col justify-between ${isSelected ? 'selected' : ''}`;
            card.innerHTML = `
                <div class="cursor-pointer" onclick="toggleCart('${c.id}')">
                    <div class="relative overflow-hidden rounded-lg mb-3 border border-[#5d4a4a]/10 bg-white">
                        <img src="${proxiedImage}" class="w-full h-40 object-cover" onerror="this.src='https://placehold.jp/24/5d4a4a/ffffff/200x200.png?text=${encodeURIComponent(c.brand)}'">
                        <div class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-white/90 text-[8px] font-bold border border-[#5d4a4a]/20">${c.finish}</div>
                    </div>
                    <h3 class="text-xs font-bold leading-tight h-8 overflow-hidden">${c.name}</h3>
                    <p class="text-[10px] opacity-60 mb-2">${c.brand}</p>
                    <span class="text-sm font-bold text-rose-600">¥ ${c.price.toLocaleString()}</span>
                </div>
                <div class="mt-4 pt-2 border-t border-[#5d4a4a]/10">
                    <a href="${c.url}" target="_blank" class="link-button w-full text-center">公式サイト 🛍️</a>
                </div>
            `;
            cosmeList.appendChild(card);
        });
    }

    function toggleCart(id) {
        const item = cosmesticsData.find(c => c.id === id);
        const idx = cartItems.findIndex(c => c.id === id);
        if (idx > -1) cartItems.splice(idx, 1);
        else cartItems.push(item);
        document.getElementById('cart-count').textContent = cartItems.length;
        updateCosmeList();
    }

    function updateCartPage() {
        const list = document.getElementById('cart-list');
        list.innerHTML = cartItems.length ? '' : '<div class="col-span-full text-center py-12 opacity-60">お気に入りはまだないよ</div>';
        cartItems.forEach(c => {
            const div = document.createElement('div');
            div.className = 'cosme-card p-4 flex gap-4 items-center bg-white';
            const proxImg = `https://images.weserv.nl/?url=${encodeURIComponent(c.image)}&w=100&errorredirect=https://placehold.jp/12/5d4a4a/ffffff/100x100.png?text=${encodeURIComponent(c.brand)}`;
            div.innerHTML = `<img src="${proxImg}" class="w-16 h-16 object-cover rounded-lg border"><div><p class="text-xs font-bold">${c.name}</p><p class="text-rose-600 font-bold text-sm">¥ ${c.price.toLocaleString()}</p></div><button class="ml-auto text-xs opacity-50 underline" onclick="toggleCart('${c.id}'); updateCartPage();">削除</button>`;
            list.appendChild(div);
        });
        updateBudget();
    }

    function updateBudget() {
        const bInput = document.getElementById('budget-input');
        const budget = bInput ? parseInt(bInput.value) || 15000 : 15000;
        const total = cartItems.reduce((s, i) => s + i.price, 0);
        document.getElementById('total-price').textContent = `¥ ${total.toLocaleString()}`;
        const pct = Math.min((total / budget) * 100, 100);
        document.getElementById('budget-bar-fill').style.width = `${pct}%`;
        document.getElementById('total-percent').textContent = `${Math.round(pct)}%`;
        const odor = total === 0 ? '😊' : pct < 50 ? '😌' : pct < 90 ? '😳' : '😱';
        document.getElementById('odor-meter').textContent = odor;
        const lastColor = cartItems.length ? cartItems[cartItems.length - 1].color : '#ffffff';
        document.getElementById('color-preview-circle').style.background = `radial-gradient(circle, ${lastColor} 0%, #fff 100%)`;
        document.getElementById('color-code').textContent = lastColor.toUpperCase();
    }

    async function scanWeather() {
        const btn = document.getElementById('btn-scan'); btn.textContent = "スキャン中...";
        if (!navigator.geolocation) return applyWeather(15, 45);
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude: lat, longitude: lon } = pos.coords;
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m`);
            const data = await res.json();
            applyWeather(data.current.temperature_2m, data.current.relative_humidity_2m);
        }, () => applyWeather(15, 45));
    }

    function applyWeather(temp, hum) {
        document.getElementById('weather-temp').textContent = `${temp} ℃`;
        document.getElementById('weather-humidity').textContent = `${hum} %`;
        document.getElementById('weather-icon').textContent = temp > 25 ? '☀️' : temp > 15 ? '☁️' : '❄️';
        const s = temp < 18 ? 'Winter' : 'Summer';
        const c = hum < 55 ? 'Dry' : 'Oily';
        setSeason(s); setConcern(c);
        document.getElementById('btn-scan').textContent = "スキャン完了！";
        document.getElementById('weather-advice').textContent = `外は${s === 'Winter' ? '寒い' : '暑い'}ので${c === 'Dry' ? '保湿' : 'テカリ防止'}重視で！`;
    }
    updateFilters();
</script>
</body>
</html>
