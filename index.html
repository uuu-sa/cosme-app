<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella Palette 〜色で選ぶパーソナルカラー〜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --color-navy: #1a1f3c; --color-gold: #d4af37; --color-rose: #e9d5d5; --color-bg: #fdfbfb; --color-accent: #db2777; }
        body { font-family: 'Zen Maru Gothic', sans-serif; background: radial-gradient(circle at 10% 20%, rgba(26, 31, 60, 0.05), transparent 50%), radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05), transparent 50%), var(--color-bg); color: #4a3f3f; min-height: 100vh; }
        .stella-title { font-family: 'Montserrat', sans-serif; letter-spacing: 0.15em; color: var(--color-navy); }
        .sketch-button { border: 2px solid var(--color-navy); border-radius: 12px; background: #fff; transition: all 0.3s; cursor: pointer; padding: 10px 20px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .sketch-button:hover { background: var(--color-rose); transform: translateY(-2px); }
        .sketch-button.active { background: var(--color-navy); color: #fff; }
        .cosme-card { background: #fff; border: 1px solid rgba(26, 31, 60, 0.1); border-radius: 24px; transition: all 0.3s ease; overflow: hidden; display: flex; flex-direction: column; }
        .cosme-card:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(26, 31, 60, 0.1); }
        .cosme-card.selected { border: 2px solid var(--color-accent); background: #fffafb; }
        .link-button { background: var(--color-navy); color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 0.85em; font-weight: bold; transition: all 0.2s; display: block; text-align: center; }
        .nav-tab { font-weight: bold; transition: all 0.3s; background: none; cursor: pointer; padding: 10px 20px; color: var(--color-navy); opacity: 0.6; position: relative; }
        .nav-tab.active { opacity: 1; color: var(--color-accent); }
        .nav-tab.active::after { content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 3px; background: var(--color-accent); border-radius: 2px; }
        .hidden { display: none; }
        .icon-svg { width: 20px; height: 20px; fill: currentColor; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .color-swatch { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .cosme-card:hover .color-swatch { transform: scale(1.1); }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-7xl mx-auto">

            <button id="tab-search" class="nav-tab active" onclick="switchPage('search')">診断</button>
            <button id="tab-lessons" class="nav-tab" onclick="switchPage('lessons')">講座</button>
            <button id="tab-mycart" class="nav-tab" onclick="switchPage('mycart')">保存 (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

                                <button id="price-petit" class="sketch-button flex-1 text-[9px] py-1" onclick="setPriceRange('Petit')">プチプラ</button>
                                <button id="price-luxury" class="sketch-button flex-1 text-[9px] py-1" onclick="setPriceRange('Luxury')">デパコス</button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <p class="text-[9px] font-bold text-gray-400 uppercase">Skin Concern</p>
                            <div class="flex gap-1">
                                <button id="btn-dry" class="sketch-button flex-1 text-[9px] py-1" onclick="setConcern('Dry')">乾燥</button>
                                <button id="btn-oily" class="sketch-button flex-1 text-[9px] py-1" onclick="setConcern('Oily')">テカリ</button>
                                <button id="btn-both" class="sketch-button flex-1 text-[9px] py-1" onclick="setConcern('Both')">どちらも</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="max-w-4xl mx-auto flex flex-wrap gap-2 justify-center">
            <button id="category-all" class="sketch-button py-1 px-4 text-[10px] active" onclick="setCategory('All')">すべて</button>
            <button id="category-base" class="sketch-button py-1 px-4 text-[10px]" onclick="setCategory('Base')">ベース</button>
            <button id="category-lip" class="sketch-button py-1 px-4 text-[10px]" onclick="setCategory('Lip')">リップ</button>
            <button id="category-eye" class="sketch-button py-1 px-4 text-[10px]" onclick="setCategory('Eye')">アイ</button>
            <button id="category-cheek" class="sketch-button py-1 px-4 text-[10px]" onclick="setCategory('Cheek')">チーク</button>
        </section>

        <main id="cosme-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-4"></main>
    </div>

    <!-- 講座ページ -->
    <div id="page-lessons" class="hidden px-4"></div>

    <!-- 保存ページ -->
    <div id="page-mycart" class="hidden px-4">
        <section class="glass p-8 rounded-3xl max-w-4xl mx-auto shadow-xl">
            <h2 class="stella-title text-2xl mb-8 font-bold text-center">My Palette</h2>
            <div id="cart-list" class="grid grid-cols-1 gap-4 mb-10"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 pt-8 border-t border-navy/10">
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold tracking-widest uppercase text-gray-400">Budget Tracker</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold">上限: ¥</span>

                        </div>
                    </div>
                    <div class="space-y-4">

                            <span id="total-percent" class="text-xs font-bold text-gray-400">0%</span>

                            <div id="budget-bar-fill" class="h-full bg-navy transition-all duration-500" style="width: 0%;"></div>

                </div>
            </div>
        </section>
    </div>
</div>

    let selectedPersonalColor = localStorage.getItem('personalColor') || 'Summer';
    let selectedConcern = 'Dry', selectedPriceRange = 'All', selectedCategory = 'All';
    let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];

    function switchPage(pageId) {
        ['search', 'mycart', 'lessons'].forEach(p => document.getElementById(`page-${p}`).classList.add('hidden'));
        ['search', 'mycart', 'lessons'].forEach(p => document.getElementById(`tab-${p}`).classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.remove('hidden');
        document.getElementById(`tab-${pageId}`).classList.add('active');
        if (pageId === 'mycart') updateCartPage();
        if (pageId === 'lessons') updateLessonsPage();
    }

    function setPersonalColor(pc) { selectedPersonalColor = pc; localStorage.setItem('personalColor', pc); update(); }
    function setConcern(c) { selectedConcern = c; update(); }
    function setPriceRange(pr) { selectedPriceRange = pr; update(); }
    function setCategory(c) { selectedCategory = c; update(); }

    function update() {
        ['spring', 'summer', 'autumn', 'winter'].forEach(id => document.getElementById(`pc-${id}`).classList.toggle('active', selectedPersonalColor.toLowerCase() === id));
        ['price-all', 'price-petit', 'price-luxury'].forEach(id => document.getElementById(id).classList.toggle('active', selectedPriceRange.toLowerCase() === id.split('-')[1]));
        ['btn-dry', 'btn-oily', 'btn-both'].forEach(id => document.getElementById(id).classList.toggle('active', selectedConcern === (id.includes('dry') ? 'Dry' : id.includes('oily') ? 'Oily' : 'Both')));
        ['all', 'base', 'lip', 'eye', 'cheek'].forEach(id => document.getElementById(`category-${id}`).classList.toggle('active', selectedCategory.toLowerCase() === id));
        
        const list = document.getElementById('cosme-list');
        const displayData = cosmesticsData.filter(c => {
            const catMatch = selectedCategory === 'All' || c.category === selectedCategory;
            const pcMatch = c.season === selectedPersonalColor;
            const priceMatch = selectedPriceRange === 'All' || (selectedPriceRange === 'Petit' && c.price < 2500) || (selectedPriceRange === 'Luxury' && c.price >= 2500);
            
            // 悩みマッチ: 選択が'Both'なら全表示、そうでなければ商品が'Both'タグ持ちか一致するもの
            const concernMatch = selectedConcern === 'Both' || c.concern === 'Both' || c.concern === selectedConcern;
            
            return catMatch && pcMatch && priceMatch && concernMatch;
        });

        list.innerHTML = displayData.length ? '' : '<div class="col-span-full text-center py-20 opacity-40 font-bold">条件に合う星が見つかりませんでした。</div>';

            const isSelected = cartItems.some(i => i.id === c.id);
            const card = document.createElement('div');
            card.className = `cosme-card p-6 flex flex-col justify-between ${isSelected ? 'selected' : ''}`;
            card.innerHTML = `
                <div class="cursor-pointer" onclick="toggleCart('${c.id}')">
                    <div class="w-full h-32 flex items-center justify-center mb-6">
                        <div class="color-swatch flex items-center justify-center" style="background: ${c.color};">
                            <div class="text-white opacity-40">${categoryIcons[c.category]}</div>
                        </div>
                    </div>
                    <div class="text-center">
                        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">${c.brand}</p>
                        <h3 class="text-xs font-bold leading-tight text-navy">${c.name}</h3>
                    </div>
                    <div class="flex justify-between items-center mt-4">
                        <span class="text-sm font-bold text-navy font-mono">¥ ${c.price.toLocaleString()}</span>
                        <div class="px-2 py-0.5 rounded-full bg-gray-100 text-[8px] font-bold text-gray-500 uppercase">${c.category}</div>
                    </div>
                </div>
                <div class="mt-4"><a href="${c.url}" target="_blank" class="link-button w-full">DETAIL</a></div>`;
            list.appendChild(card);
        });
        document.getElementById('cart-count').textContent = cartItems.length;
    }

    function toggleCart(id) {
        const idx = cartItems.findIndex(i => i.id === id);
        if (idx > -1) cartItems.splice(idx, 1); else cartItems.push(cosmesticsData.find(i => i.id === id));
        localStorage.setItem('cartItems', JSON.stringify(cartItems)); update();
    }

    function updateCartPage() {
        const list = document.getElementById('cart-list');
        list.innerHTML = cartItems.length ? '' : '<div class="text-center py-20 opacity-30 text-xs font-bold">まだお気に入りはありません</div>';
        cartItems.forEach(c => {
            const div = document.createElement('div'); div.className = 'glass p-4 flex gap-4 items-center rounded-2xl';
            div.innerHTML = `<div class="w-12 h-12 rounded-full border-2 border-white shadow-sm" style="background: ${c.color}"></div><div class="flex-1"><p class="text-xs font-bold text-navy">${c.name}</p><p class="text-navy font-bold text-xs mt-1">¥ ${c.price.toLocaleString()}</p></div><button class="p-2 text-rose-400 font-bold" onclick="toggleCart('${c.id}'); updateCartPage();">削除</button>`;
            list.appendChild(div);
        });
        updateBudget();
    }

    function updateBudget() {
        const total = cartItems.reduce((s, i) => s + i.price, 0);
        const budget = parseInt(document.getElementById('budget-input').value) || 15000;
        document.getElementById('total-price').textContent = `¥ ${total.toLocaleString()}`;
        const pct = Math.min((total / budget) * 100, 100);
        const bar = document.getElementById('budget-bar-fill');
        if (bar) bar.style.width = `${pct}%`;
        const pctText = document.getElementById('total-percent');
        if (pctText) pctText.textContent = `${Math.round(pct)}%`;
        const lastItem = cartItems[cartItems.length - 1];
        const preview = document.getElementById('color-preview-circle');
        if (preview) {
            preview.style.background = lastItem ? `radial-gradient(circle, ${lastItem.color} 0%, #fff 100%)` : '#f9f9f9';
            document.getElementById('color-code').textContent = lastItem ? lastItem.color.toUpperCase() : '#???';
        }
    }

    function updateLessonsPage() {
        const container = document.getElementById('page-lessons');
        container.innerHTML = `
            <section class="max-w-6xl mx-auto py-12 space-y-12">
                <header class="text-center">
                    <h2 class="stella-title text-3xl font-bold uppercase">Stella Lessons</h2>
                    <p class="text-xs text-gray-500 mt-2">プロが教える、最高に輝くためのテクニック</p>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 px-4">
                    <div class="glass rounded-3xl overflow-hidden shadow-lg">
                        <div class="aspect-video bg-black">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/videoseries?list=UU7-Z35q08uW_XpIdf75E_Bw" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-6">
                            <h3 class="font-bold text-lg mb-2">鹿の間 🦌</h3>
                            <p class="text-xs text-gray-500">垢抜けメイクやパーソナルカラー活用術のスペシャリスト。</p>
                        </div>
                    </div>
                    <div class="glass rounded-3xl overflow-hidden shadow-lg">
                        <div class="aspect-video bg-black">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/videoseries?list=UUO9z-oW-6H_E6vE5N73i-OQ" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <div class="p-6">
                            <h3 class="font-bold text-lg mb-2">小田切ヒロ 💄</h3>
                            <p class="text-xs text-gray-500">プロ視点での最新トレンド＆究極のテクニック講座。</p>
                        </div>
                    </div>
                </div>
            </section>
        `;
    }

    async function scanWeather() {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m`);
                const data = await res.json();
                const t = data.current.temperature_2m;
                document.getElementById('weather-temp').textContent = `${t}°C`;
                document.getElementById('weather-advice').textContent = `今日は${t < 18 ? '冷える' : '暑い'}ので対策を！`;
                update();
            } catch (e) {}
        });
    }
    update();
</script>
</body>
</html>
